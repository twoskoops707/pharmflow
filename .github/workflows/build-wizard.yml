name: Build PharmFlow (.exe)

# Branch policy: develop on `main` only. `dev` is deprecated — do not push feature work to `dev`.
on:
  push:
    branches:
      - main
    # Run on every main push per operator policy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          # MUST match the pythonw version the farm helpers run under on the
          # operator box (pythoncore-3.14-64). A mismatched bundle extracts
          # .pyd files compiled for another CPython, and helper lanes then die
          # with "Module use of pythonXXX.dll conflicts with this version".
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Single source with root requirements.txt (websockets/psutil for dashboard; pywebview for wizard).
          # Smoke steps do not import automation/dashboard.py; PyInstaller bundle still matches user pip installs.
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Smoke — wizard imports + browser builder + sequence tests
        env:
          CPHARM_SEQUENCES_DIR: ${{ github.workspace }}/sequences
        run: |
          python -m compileall -q automation
          python -m py_compile wizard/setup_wizard.py
          python -m py_compile wizard/cpharm_app_webview.py
          python -m py_compile wizard/cpharm_wizard_bridge.py
          python -m py_compile wizard/phone_setup_entry.py
          python -m py_compile wizard/cpharm_mumu_setup.py
          python -m py_compile wizard/preflight_core.py
          python -m py_compile wizard/mumu_setup_core.py
          python -m py_compile wizard/mumu_setup_webview.py
          python -m py_compile wizard/setup_startup_cleanup.py
          python -m py_compile wizard/mumu_detect.py
          python -m py_compile tools/kill_cpharm_stale_processes.py
          python -m py_compile tools/notify_ntfy.py
          python -m py_compile tools/cpharm_watchdog.py
          python -m py_compile tools/project_agent.py
          python -m py_compile tools/cloud_agent.py
          python -m py_compile automation/dashboard.py
          python wizard/smoke_app_js.py
          python wizard/smoke_layout.py
          python wizard/smoke_audit_flow.py
          python wizard/smoke_frozen_imports.py
          python wizard/smoke_browser_builder.py
          python wizard/smoke_sequence_generator_flow.py
          python wizard/smoke_tk_pages.py
          python automation/recordings/sequences/generate_home_combo_sequences.py
          python -m unittest discover -s wizard -p "test_*.py"
          python -m unittest automation.test_mumu_fingerprint -v
          python -m unittest automation.test_sequence_snowflake -v
          python -m unittest automation.test_sequence_wait_duplicates -v
          python -m unittest automation.test_browse_proxy -v
          python -m unittest automation.test_emulator_ad_mode -v
          python automation/verify_ad_sequence_samples.py
          python automation/verify_mantis_hardcode_sequences.py
          python automation/verify_sequence_matrix_counts.py
          python automation/smoke_home_combo_ui_loader.py
          cmd /c "python automation/audit_dabflow_live.py || echo WARN: live DabFlow deploy still has zone typos — PharmFlow runtime CDP patch compensates; deploy dabflow-fix/app.js when ready"

      - name: Stamp build info for EXE tracking
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $info = [ordered]@{
            build_number = $env:BUILD_NUMBER
            commit = $env:BUILD_COMMIT
            product = "PharmFlow"
            generated_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $dir = "wizard/assets"
          if (-not (Test-Path $dir -PathType Container)) { New-Item -ItemType Directory -Path $dir | Out-Null }
          ($info | ConvertTo-Json) | Set-Content -Path (Join-Path $dir "build_info.json") -Encoding utf8
          Get-Content (Join-Path $dir "build_info.json")

      # Browser APKs ship INSIDE the EXE so installs work offline (see
      # tools/prefetch_browser_apks.py). Chromium mirrors are dead — the script
      # tries, logs honestly, and embeds Firefox/Brave/DuckDuckGo/Opera.
      - name: Prefetch browser APKs into the EXE
        working-directory: wizard
        run: python ../tools/prefetch_browser_apks.py

      # ARM64 .NET 8 deck fix: pywebview's edgechromium backend reflects the
      # WebView2 WinForms control, whose surface references System.Windows.Forms.
      # ContextMenu — removed in .NET Core 5+. The shim supplies that type so the
      # deck starts on native ARM64 (netfx pythonnet is impossible there). Vendored
      # under wizard/bundled/webview2_netcore/, regenerated here so CI is hermetic.
      - name: Ensure WinForms compat shim (ARM64 .NET 8 deck)
        shell: pwsh
        run: |
          $out = 'wizard/bundled/webview2_netcore/CPharmWinFormsCompat.dll'
          if (-not (Test-Path $out)) {
            $src = @'
          using System;
          using System.ComponentModel;

          namespace System.Windows.Forms
          {
              [System.ComponentModel.ToolboxItem(false)]
              [Obsolete("Compatibility shim for .NET 8 - type removed upstream.")]
              public class ContextMenu : Component
              {
                  public ContextMenu() { }
              }
          }
          '@
            Add-Type -TypeDefinition $src -OutputAssembly $out -OutputType Library
            Write-Host "generated $out"
          } else {
            Write-Host "shim present: $out"
          }

      # Single shipped binary: PharmFlow.exe (9-step wizard + phone setup + dashboard).
      # Retry x3: Defender's first-touch scan of the freshly-prefetched APKs can
      # briefly hold a read lock mid-archive, surfacing as an intermittent
      # PermissionError in PyInstaller's CArchiveWriter — a retry clears it.
      - name: Build PharmFlow.exe
        working-directory: wizard
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pyinstaller attempt $i/$attempts"
            pyinstaller PharmFlow.spec
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $attempts) { Write-Host "build failed (exit $LASTEXITCODE) — retrying in 20s"; Start-Sleep -Seconds 20 }
            else { exit $LASTEXITCODE }
          }

      # Single EXE per operator decision: watchdog + agent logic run inside
      # PharmFlow.exe (background threads). tools/cpharm_watchdog.py and
      # tools/project_agent.py stay bundled as importable modules.
      - name: Smoke — verify EXE artifact and CLI flags
        shell: pwsh
        run: .\tools\verify_release_build.ps1

      - name: Validate release metadata inputs
        shell: pwsh
        run: |
          if (-not (Test-Path wizard/dist/PharmFlow.exe -PathType Leaf)) { throw 'PharmFlow.exe missing before manifest generation' }

      - name: Create signed release manifest
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $files = @(
            "wizard/dist/PharmFlow.exe"
          )
          $entries = foreach ($file in $files) {
            $item = Get-Item $file
            [ordered]@{
              name = $item.Name
              path = $file.Replace("\\", "/")
              size_bytes = $item.Length
              sha256 = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{
            product = "PharmFlow"
            build_number = $env:BUILD_NUMBER
            commit = $env:BUILD_COMMIT
            python = (python --version 2>&1).ToString()
            generated_utc = (Get-Date).ToUniversalTime().ToString("o")
            artifacts = @($entries)
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          Set-Content -Path release-manifest.json -Value $json -Encoding utf8
          $checksum_lines = $entries | ForEach-Object { "$($_.sha256)  $($_.name)" }
          Set-Content -Path checksums-sha256.txt -Value $checksum_lines -Encoding utf8
          Get-Content release-manifest.json
          Get-Content checksums-sha256.txt

      - name: Prepare portable launcher bundle
        shell: pwsh
        run: |
          Copy-Item tools/launch_cpharm.ps1 wizard/dist/launch_cpharm.ps1
          Copy-Item checksums-sha256.txt wizard/dist/checksums-sha256.txt
          Copy-Item release-manifest.json wizard/dist/release-manifest.json
          if (-not (Test-Path wizard/dist/PharmFlow.exe -PathType Leaf)) { throw 'PharmFlow.exe was not built' }

      # Fallback only — release assets are canonical and use a separate quota.
      # Continue-on-error so an Actions artifact-storage quota hit never blocks
      # the Create GitHub Release step; 1-day retention keeps quota low.
      - name: Upload EXE artifacts
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pharmflow-exes-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 1
          path: wizard/dist

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          BUILD_NUM: ${{ github.run_number }}
        with:
          tag_name: wizard-${{ github.run_number }}
          name: "PharmFlow (build ${{ github.run_number }})"
          body: |
            ## PharmFlow Windows tools (build ${{ github.run_number }})

            Download **PharmFlow.exe** into **`C:\PharmFlow\`** (one file — watchdog and agent run inside):
            - **PharmFlow.exe** — wizard + **Start farm** + operator dash **http://127.0.0.1:8091/** + built-in watchdog/agent

            ### Mantis money farm
            1. Start your phones yourself (MuMu VMs, AVD, or Docker redroid) — the EXE never opens or closes emulators by itself.
            2. **FarmBrowser** on each phone (`farmbrowser/` APK in repo).
            3. **PharmFlow.exe → Start farm** (unison: farm + stealth + watchdog + FreeBuff). It farms every phone live on ADB — no roster, no canonical list. Once running, a phone that drops is spun back up automatically.
            4. Dashboard **:8091** — not the wizard `:8080` server.
            5. No phone up? Test view has **Spin up one phone to test** (Docker redroid or MuMu VM, your click only).

            ### FarmBrowser
            - Package: `com.farmbrowser.stealth.debug` (Path3 / Mantis clicks)
            - Sequences: `preferred_browser` + `browser_tag: farmbrowser` (see `sequences/`)
            - Automation SSOT mirrored from [FamFlow](https://github.com/twoskoops707/FamFlow)

            ### Wizard / groups mode
            1. Install MuMu, portrait **Phone** **900×1600**, USB debugging.
            2. **Phones → Set up my phones** → **Run → Start server** → **Run all groups**.
            3. Wizard dashboard: `http://localhost:8080`

            Full guide: `docs/EXE_QUICK_START.md`

            ### Release integrity
            - **checksums-sha256.txt** — SHA256 for the EXE
            - **release-manifest.json** — commit, Python version, sizes, hashes
          files: |
            wizard/dist/PharmFlow.exe
            wizard/dist/launch_cpharm.ps1
            wizard/dist/checksums-sha256.txt
            wizard/dist/release-manifest.json
          draft: false
          prerelease: false

      - name: Upload fallback bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pharmflow-release-fallback-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            wizard/dist/PharmFlow.exe
            wizard/dist/launch_cpharm.ps1
            checksums-sha256.txt
            release-manifest.json

      # Release assets are the canonical downloads. Actions artifact storage is
      # quota-limited, so do not upload a second copy of the EXE.

      - name: Notify ntfy (release ready)
        if: success()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.NFTY }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: >
          python tools/notify_ntfy.py
          "PharmFlow wizard-${{ github.run_number }} shipped — https://github.com/twoskoops707/pharmflow/releases/tag/wizard-${{ github.run_number }}"
          --title "PharmFlow build done"
          --tags "white_check_mark,package"


  # Native ARM64 probe (Snapdragon/X Elite operator box runs x64 under
  # emulation today). Free on public repos (windows-11-arm preview). Non-
  # blocking on purpose: this job must prove itself without ever delaying the
  # proven x64 release above.
  arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Assert native ARM64 interpreter (not emulated x64)
        shell: pwsh
        run: |
          $arch = (python -c "import platform; print(platform.machine().lower())").Trim()
          Write-Host "python machine: $arch"
          if ($arch -notin @('arm64', 'aarch64')) { throw "Expected native arm64 python, got $arch" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # ARM64 EXE must match the x64 bundle: browser APKs ship INSIDE the EXE so
      # offline installs work on the Snapdragon operator box. Without this step
      # the ARM64 build was 41MB vs the x64's 525MB — silent feature loss.
      - name: Prefetch browser APKs into the EXE
        working-directory: wizard
        run: python ../tools/prefetch_browser_apks.py

      - name: Smoke — compile + imports that matter on arm64
        run: |
          python -m py_compile wizard/cpharm_app_webview.py
          python -m py_compile wizard/cpharm_wizard_bridge.py
          python -m py_compile wizard/setup_wizard.py
          python -m py_compile wizard/mumu_farm_ops.py
          python -m py_compile wizard/farm_control.py
          python -m py_compile wizard/farm_settings.py
          python -m py_compile scripts/run_farm_354.py
          python wizard/smoke_app_js.py
          python wizard/smoke_frozen_imports.py

      - name: Ensure WinForms compat shim (ARM64 .NET 8 deck)
        shell: pwsh
        run: |
          $out = 'wizard/bundled/webview2_netcore/CPharmWinFormsCompat.dll'
          if (-not (Test-Path $out)) {
            $src = @'
          using System;
          using System.ComponentModel;

          namespace System.Windows.Forms
          {
              [System.ComponentModel.ToolboxItem(false)]
              [Obsolete("Compatibility shim for .NET 8 - type removed upstream.")]
              public class ContextMenu : Component
              {
                  public ContextMenu() { }
              }
          }
          '@
            Add-Type -TypeDefinition $src -OutputAssembly $out -OutputType Library
            Write-Host "generated $out"
          } else {
            Write-Host "shim present: $out"
          }

      - name: Build native ARM64 PharmFlow.exe
        working-directory: wizard
        run: pyinstaller PharmFlow.spec

      - name: Report native ARM64 artifact
        shell: pwsh
        run: |
          if (-not (Test-Path wizard/dist/PharmFlow.exe -PathType Leaf)) {
            Write-Warning "No PharmFlow.exe produced on arm64"
          } else {
            $f = Get-Item wizard/dist/PharmFlow.exe
            Write-Host ("arm64 PharmFlow.exe bytes={0} sha256={1}" -f $f.Length, (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant())
          }

      - name: Upload native ARM64 EXE artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pharmflow-arm64-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: wizard/dist/PharmFlow.exe

      # Release assets are the reliable download channel on this repo (Actions
      # artifact storage has silently dropped runs); publish the native ARM64
      # EXE as its own release tag so the Snapdragon box installs it directly.
      - name: Create GitHub Release (native ARM64)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wizard-arm64-${{ github.run_number }}
          name: "PharmFlow ARM64 (build ${{ github.run_number }})"
          body: |
            ## PharmFlow native ARM64 (build ${{ github.run_number }})

            Native Windows-on-ARM build for Snapdragon X / X Elite machines. No x64 emulation — python and every lane run native.
            Replace **PharmFlow.exe** in **`C:\PharmFlow\`** with this file.

            Release integrity:
            - **checksums-sha256.txt** — SHA256 for the EXE
          files: |
            wizard/dist/PharmFlow.exe
          draft: false
          prerelease: false
