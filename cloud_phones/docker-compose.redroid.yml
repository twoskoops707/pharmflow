services:
  redroid-0:
    image: redroid/redroid:14.0.0-latest
    container_name: redroid-0
    ports:
      - "5555:5555"
    volumes:
      - ./data/redroid-0:/data
    privileged: true
    # Redroid requires binder devices on native Linux. Docker Desktop/WSL
    # does not expose them reliably, so this stack intentionally omits them.
    environment:
      - REDROID_BOOTANIMATION=0
      - REDROID_WIDTH=900
      - REDROID_HEIGHT=1600
      - REDROID_DPI=420
      - REDROID_GPU_MODE=guest
      - RO_PRODUCT_BRAND=samsung
      - RO_PRODUCT_MODEL=SM-A546B
      - RO_PRODUCT_DEVICE=a54x
      - RO_HARDWARE=s5e8835
      - RO_BUILD_FINGERPRINT=samsung/a54x/a54x:14/UP1A.231005.007/A546BXXU1AWF1:user/release-keys
      - RO_KERNEL_QEMU=0
      - RO_SECURE=1
      - RO_BUILD_TAGS=release-keys
      - RO_BUILD_TYPE=user
    restart: unless-stopped
    networks:
      - redroid-net

